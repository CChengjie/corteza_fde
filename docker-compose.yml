name: city311

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corteza}
      POSTGRES_USER: ${POSTGRES_USER:-corteza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corteza-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-city311-development}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      # Corteza consumes DB_DSN; DATABASE_URL is the deployment-facing contract.
      DATABASE_URL: ${DATABASE_URL:-postgres://corteza:corteza-local-password@postgres:5432/corteza?sslmode=disable}
      DB_DSN: ${DATABASE_URL:-postgres://corteza:corteza-local-password@postgres:5432/corteza?sslmode=disable}
      UPGRADE_ALWAYS: "true"
      PROVISION_ALWAYS: "true"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      HTTP_ADDR: 0.0.0.0:80
      HTTP_API_BASE_URL: /api
      HTTP_WEBAPP_ENABLED: "false"
      PROVISION_PATH: /corteza/provision/*
      STORAGE_PATH: /data
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      BENCHMARK_TIMEZONE: ${BENCHMARK_TIMEZONE:-America/New_York}
      BENCHMARK_NOW: ${BENCHMARK_NOW:-2026-02-03T15:04:05Z}
      BENCHMARK_SEED: ${BENCHMARK_SEED:-city311-public-v1}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:8080}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-jwt-secret-change-before-deployment}
      AUTH_EXTERNAL_COOKIE_SECRET: ${AUTH_EXTERNAL_COOKIE_SECRET:-local-only-cookie-secret-change-before-deployment}
      AUTH_CSRF_SECRET: ${AUTH_CSRF_SECRET:-local-only-csrf-secret-change-before-deployment}
      SESSION_SECRET: ${SESSION_SECRET:-local-only-city311-session-secret-change-before-deployment}
      CITY311_SEED_CONSTITUENT_PASSWORD: ${CITY311_SEED_CONSTITUENT_PASSWORD:-City311-Local-Constituent-1!}
      CITY311_SEED_CONSTITUENT_TWO_PASSWORD: ${CITY311_SEED_CONSTITUENT_TWO_PASSWORD:-City311-Local-Constituent-2!}
      MAP_BASE_URL: ${MAP_BASE_URL:-https://mapping.example.invalid}
      MAP_API_TOKEN: ${MAP_API_TOKEN:-local-only-mapping-token}
      CIVICWORKS_BASE_URL: ${CIVICWORKS_BASE_URL:-https://civicworks.example.invalid}
      CIVICWORKS_API_TOKEN: ${CIVICWORKS_API_TOKEN:-local-only-civicworks-token}
      CIVICWORKS_WEBHOOK_SECRET: ${CIVICWORKS_WEBHOOK_SECRET:-local-only-civicworks-webhook-secret}
      BENCHMARK_RUN_ID: ${BENCHMARK_RUN_ID:-city311-local}
      WORKFLOW_OAUTH_TOKEN_URL: ${WORKFLOW_OAUTH_TOKEN_URL:-https://workflow.example.invalid/oauth/token}
      WORKFLOW_API_BASE_URL: ${WORKFLOW_API_BASE_URL:-https://workflow.example.invalid}
      WORKFLOW_CLIENT_ID: ${WORKFLOW_CLIENT_ID:-city311-local}
      WORKFLOW_CLIENT_SECRET: ${WORKFLOW_CLIENT_SECRET:-local-only-workflow-secret}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://identity.example.invalid}
      OIDC_STAFF_CLIENT_ID: ${OIDC_STAFF_CLIENT_ID:-city311-staff}
      OIDC_PUBLIC_CLIENT_ID: ${OIDC_PUBLIC_CLIENT_ID:-city311-public}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-local-only-oidc-secret}
      SAML_METADATA_URL: ${SAML_METADATA_URL:-https://identity.example.invalid/saml/metadata}
      SAML_SP_ENTITY_ID: ${SAML_SP_ENTITY_ID:-http://localhost:8080/saml}
      CRM_API_CLIENT_ID: ${CRM_API_CLIENT_ID:-city311-local-api-client}
      CRM_API_CLIENT_SECRET: ${CRM_API_CLIENT_SECRET:-local-only-crm-api-secret}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-mail.example.invalid}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-city311-local}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-local-only-mail-password}
      MAIL_API_BASE_URL: ${MAIL_API_BASE_URL:-https://mail.example.invalid}
      MAIL_API_TOKEN: ${MAIL_API_TOKEN:-local-only-mail-api-token}
      SMTP_HOST: ${MAIL_SMTP_HOST:-mail.example.invalid}
      SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      SMTP_USER: ${MAIL_SMTP_USERNAME:-city311-local}
      SMTP_PASS: ${MAIL_SMTP_PASSWORD:-local-only-mail-password}
      SMTP_FROM: ${MAIL_FROM:-noreply@city.example}
    volumes:
      - attachment_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:80/healthz | grep --quiet '\"database\":\"ok\"'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    stop_grace_period: 30s

volumes:
  postgres_data:
  attachment_data:
