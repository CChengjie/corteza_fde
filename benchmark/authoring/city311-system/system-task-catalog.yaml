family: C311-SYS
title: City311 whole-system customer-bound delivery
root:
  id: C311-SYS-B0
  mode: whole_system_greenfield
  contents: [customer-context, external-fixtures, empty-build-harness]
  excludes: [corteza-product-source, city311-product-source, database-schema, business-api, product-ui]
global_constraints:
  - GC-01: Empty database and empty persistent volume must deploy.
  - GC-02: Customer boundaries are fixture-only; no local replacement or public-network dependency.
  - GC-03: Secrets and private data never appear in logs, errors, public API, or audit payloads.
  - GC-04: Failed work is atomic; retries, restart, and migration preserve prior customer data.
  - GC-05: Every node preserves all predecessor contracts unless its R defines a migration.
release_rule: B_and_answer_independently_start_and_pass_node_oracle
canonical_order: [P1, D1, I1, G1, U1, O1, P2, D2, I2, G2, U2, O2, P3, D3, I3, G3, U3, O3, P4, D4, I4, G4, U4, O4, P5, D5, I5, G5, U5, O5, P6, D6, I6, G6, U6, O6]
nodes:
  - {id: P1, predecessor: B0, lane: platform, requirement: "Build the source repo, container runtime, configuration loader, health endpoint, and empty application process.", constraints: [no_prebuilt_product, process_and_database_readiness], fixtures: [postgres], oracle: [build, empty_boot, health]}
  - {id: D1, predecessor: P1, lane: domain, requirement: "Define City311 contracts for residents, departments, districts, requests, request numbers, and statuses.", constraints: [public_request_numbers_are_not_db_ids, contract_is_versioned], fixtures: [postgres], oracle: [contract, migration]}
  - {id: I1, predecessor: D1, lane: integration, requirement: "Add integration adapters, secret injection, timeouts, and typed boundary failures.", constraints: [no_direct_business_http, secrets_never_exposed], fixtures: [mapping, object-storage, identity, mail, civicworks], oracle: [adapter, secret_redaction]}
  - {id: G1, predecessor: I1, lane: governance, requirement: "Record actor, source, object, and time in a common audit model.", constraints: [audit_required, no_secret_or_attachment_content], fixtures: [postgres], oracle: [audit]}
  - {id: U1, predecessor: G1, lane: user_delivery, requirement: "Build the public web shell, API client, session state, and error/loading states.", constraints: [no_browser_secret, explicit_failure_state], fixtures: [browser], oracle: [browser_smoke]}
  - {id: O1, predecessor: U1, lane: operations, requirement: "Freeze deterministic clock, seed, runtime fixtures, and clean-install acceptance.", constraints: [no_public_network, reproducible_run], fixtures: [postgres, mapping, object-storage, identity, mail, civicworks], oracle: [clean_install]}
  - {id: P2, predecessor: O1, lane: platform, requirement: "Implement store, transactions, migrations, and stable ID allocation.", constraints: [idempotent_migration, no_fixture_schema_dependency], fixtures: [postgres], oracle: [transaction, migration_replay]}
  - {id: D2, predecessor: P2, lane: domain, requirement: "Allow anonymous pothole submission with stable public number and SUBMITTED state.", constraints: [validated_requester_location_service_type, no_unnumbered_request], fixtures: [postgres], oracle: [submit, request_number]}
  - {id: I2, predecessor: D2, lane: integration, requirement: "Validate request location through the supplied mapping boundary.", constraints: [mapping_mandatory, mapping_failure_no_write], fixtures: [mapping], oracle: [boundary_call, outage_rollback]}
  - {id: G2, predecessor: I2, lane: governance, requirement: "Implement request state machine, transition policy, and optimistic versioning.", constraints: [illegal_transition_no_write, stale_version_rejected], fixtures: [postgres], oracle: [state_machine]}
  - {id: U2, predecessor: G2, lane: user_delivery, requirement: "Deliver the anonymous pothole form, mapping feedback, and confirmation page.", constraints: [duplicate_submit_protected, no_fixture_diagnostics], fixtures: [browser, mapping], oracle: [browser_submit]}
  - {id: O2, predecessor: U2, lane: operations, requirement: "Prove empty-DB install, restart, and persistent-volume survival.", constraints: [request_survives_restart, fixture_restart_safe], fixtures: [postgres, volume], oracle: [restart]}
  - {id: P3, predecessor: O2, lane: platform, requirement: "Implement local identity, session, RBAC, and server-side department/district scopes.", constraints: [default_deny, client_scope_untrusted], fixtures: [identity, postgres], oracle: [auth, rbac]}
  - {id: D3, predecessor: P3, lane: domain, requirement: "Deliver scoped staff queue and request detail.", constraints: [scope_hidden_from_list_count_token_and_detail, attachment_scope_enforced], fixtures: [identity, postgres], oracle: [staff_scope]}
  - {id: I3, predecessor: D3, lane: integration, requirement: "Implement staged object-storage attachment upload, commit, rollback, and download.", constraints: [validate_before_write, failed_submit_no_orphan, download_reauthorizes], fixtures: [object-storage], oracle: [attachment_atomicity]}
  - {id: G3, predecessor: I3, lane: governance, requirement: "Add searchable request audit history and retention behavior.", constraints: [audit_scope_enforced, attachment_bytes_not_audited], fixtures: [postgres], oracle: [audit_history]}
  - {id: U3, predecessor: G3, lane: user_delivery, requirement: "Deliver resident request list, drafts, attachment upload, and anonymous-account linking.", constraints: [resident_ownership_only, attachment_authorization_server_side], fixtures: [browser, object-storage, identity], oracle: [portal]}
  - {id: O3, predecessor: U3, lane: operations, requirement: "Prove concurrent submission, idempotency, rollback, and crash recovery.", constraints: [same_key_one_request, changed_payload_conflict], fixtures: [postgres, object-storage], oracle: [concurrency, rollback]}
  - {id: P4, predecessor: O3, lane: platform, requirement: "Add versioned API gateway, request IDs, CORS/CSRF policy, and typed API errors.", constraints: [unknown_fields_rejected, internal_errors_hidden], fixtures: [browser], oracle: [api_contract]}
  - {id: D4, predecessor: P4, lane: domain, requirement: "Add request-number plus submitted-email public status and public history projection.", constraints: [minimal_projection, wrong_pair_indistinguishable_from_missing], fixtures: [postgres], oracle: [public_privacy]}
  - {id: I4, predecessor: D4, lane: integration, requirement: "Create or associate CivicWorks work orders and reconcile ambiguous creates.", constraints: [no_duplicate_work_order_after_timeout, external_id_persisted], fixtures: [civicworks], oracle: [reconciliation]}
  - {id: G4, predecessor: I4, lane: governance, requirement: "Add versioned workflow and integration configuration publication/rollback.", constraints: [publish_validation, rollback_audited, optimistic_config_write], fixtures: [postgres], oracle: [configuration]}
  - {id: U4, predecessor: G4, lane: user_delivery, requirement: "Deliver staff queue/detail, transition, assignment, and scope-aware action UI.", constraints: [frontend_not_authority_boundary, denied_response_clears_stale_data], fixtures: [browser, identity], oracle: [staff_browser]}
  - {id: O4, predecessor: U4, lane: operations, requirement: "Prove timeout, partial failure, retry, and reconciliation behavior across boundaries.", constraints: [no_silent_message_loss, bounded_retry, no_duplicate_external_side_effect], fixtures: [mapping, object-storage, civicworks, mail], oracle: [fault_injection]}
  - {id: P5, predecessor: O4, lane: platform, requirement: "Add provisioning, repeatable seed loader, runtime configuration reload, and secret rotation hooks.", constraints: [seed_preserves_operator_edits, secret_rotation_invalidates_old_secret], fixtures: [postgres], oracle: [provisioning]}
  - {id: D5, predecessor: P5, lane: domain, requirement: "Add reassignment, collaborators, notes, duplicates, reopen, and bulk handling.", constraints: [versioned_writes, bulk_outcome_explicit, state_and_audit_consistent], fixtures: [postgres, identity], oracle: [advanced_workflow]}
  - {id: I5, predecessor: D5, lane: integration, requirement: "Add mail delivery, OIDC/SAML federation, and customer identity claim mapping.", constraints: [claim_allowlist, provider_failure_no_authorization_change], fixtures: [mail, identity], oracle: [federation, mail]}
  - {id: G5, predecessor: I5, lane: governance, requirement: "Add scoped exports, export lifecycle, retention policy, and audited delivery.", constraints: [export_respects_scope, expiring_result, no_sensitive_export_leak], fixtures: [object-storage, identity], oracle: [export]}
  - {id: U5, predecessor: G5, lane: user_delivery, requirement: "Deliver administration UI for integrations, workflows, content, branding, and reports.", constraints: [secrets_write_only, config_versions_visible, admin_rbac], fixtures: [browser, identity], oracle: [admin_browser]}
  - {id: O5, predecessor: U5, lane: operations, requirement: "Add metrics, structured logs, readiness, backup/restore, and capacity baseline.", constraints: [metrics_no_pii, restore_preserves_acl_requests_attachments_audit], fixtures: [postgres, object-storage], oracle: [restore, observability]}
  - {id: P6, predecessor: O5, lane: platform, requirement: "Finish secure deployment packaging, upgrade compatibility, and runtime configuration validation.", constraints: [incompatible_config_fail_fast, upgrade_no_data_or_permission_loss], fixtures: [postgres], oracle: [upgrade]}
  - {id: D6, predecessor: P6, lane: domain, requirement: "Migrate legacy requests, retain old request numbers, and complete domain compatibility.", constraints: [legacy_public_links_survive, no_renumber_or_attachment_loss], fixtures: [legacy-history, postgres], oracle: [legacy_migration]}
  - {id: I6, predecessor: D6, lane: integration, requirement: "Add verified webhooks, callback idempotency, dead-letter recovery, and credential rotation.", constraints: [invalid_signature_zero_effect, replay_idempotent, rotated_credentials_enforced], fixtures: [civicworks, mail, identity], oracle: [webhook_recovery]}
  - {id: G6, predecessor: I6, lane: governance, requirement: "Deliver privacy deletion, legal hold, account deletion, and final audit integrity.", constraints: [legal_hold_blocks_delete, minimal_audit_retained, public_visibility_reconciled], fixtures: [postgres, object-storage], oracle: [privacy]}
  - {id: U6, predecessor: G6, lane: user_delivery, requirement: "Complete i18n, accessibility, mobile behavior, and end-to-end public/staff acceptance.", constraints: [keyboard_critical_flow, no_mobile_data_overlap, public_page_no_auth_leak], fixtures: [browser], oracle: [e2e_browser]}
  - {id: O6, predecessor: U6, lane: operations, requirement: "Run final clean-install, upgrade, restart, fault-injection, and accumulated-obligation acceptance.", constraints: [all_prior_obligations_preserved, release_requires_full_pass], fixtures: [all], oracle: [full_system_acceptance]}
