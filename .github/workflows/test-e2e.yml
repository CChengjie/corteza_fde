name: 'E2e test on main branch push'

# These jobs can be tested with nektos/act tool
# https://github.com/nektos/act
#
# Look for "!env.ACT" in the DRY_RUN expression below

on:
  push:
    branches:
      - '20[0-9][0-9].[0-9].x'
      - '20[0-9][0-9].[0-9].[0-9]'
      - 'codex/fix-e2e-login-ci'

env:
  BUILD_OS: linux
  BUILD_ARCH: amd64

  GO_VERSION: 1.24.1
  GOFLAGS: -mod=readonly

  NODE_VERSION: 22
  CYPRESS_VERSION: 13.5.0
  CYPRESS_HOST: http://localhost:8888
  CYPRESS_BASE_URL: http://localhost:8888
  CYPRESS_ADMIN_URL: http://localhost:8080
  CYPRESS_COMPOSE_URL: http://localhost:8081
  CYPRESS_WORKFLOW_URL: http://localhost:8082
  CYPRESS_REPORTER_URL: http://localhost:8083
  CYPRESS_ONE_URL: http://localhost:8086
  CYPRESS_PRIVACY_URL: http://localhost:8087
  CYPRESS_USER_EMAIL: cypress@test.com
  CYPRESS_USER_PASSWORD: cypress123
  CYPRESS_USER_PASSWORD_NEW: newcypress123
  CYPRESS_USER_EMAIL_NEW: permissions@email.com
  CYPRESS_USER_DPO: dpo@email.com
  CYPRESS_USER_DPO_PASSWORD: dpo@email.com
  CYPRESS_PROVISION_DB_DSN: postgres://corteza:root@localhost:5432/corteza_cy_test?sslmode=disable

jobs:
  server-client-setup:
    name: server and client test
    strategy:
      matrix:
        client:
          - { port: 8080, name: admin }

          # todo - these tests must first be provisioned in order to work,
          # only admin for now
          # - { port: 8080, name: server }
          # - { port: 8081, name: compose }
          # - { port: 8082, name: workflow }
          # - { port: 8083, name: reporter }
          # - { port: 8086, name: one }
          # - { port: 8087, name: privacy }
    runs-on: ubuntu-22.04
    steps:
      - name: Setup environment
        env:
          RELEASE_CRUST_SFTP_KEY: ${{ secrets.RELEASE_CRUST_SFTP_KEY }}
          RELEASE_CRUST_SFTP_URI: ${{ secrets.RELEASE_CRUST_SFTP_URI }}
          CLIENT_NAME: ${{ matrix.client.name }}
        run: |
          echo "TMP_KEY=$(mktemp)" >> $GITHUB_ENV

      - name: Create crust key
        env:
          RELEASE_CRUST_SFTP_KEY: ${{ secrets.RELEASE_CRUST_SFTP_KEY }}
          RELEASE_CRUST_KEY_FILE: ${{ env.TMP_KEY }}
        run: |
          echo ${RELEASE_CRUST_SFTP_KEY} | base64 -d > ${RELEASE_CRUST_KEY_FILE} && \
          echo ${RELEASE_CRUST_SFTP_KEY} > /tmp/foo

      - uses: actions/setup-node@v3
        with: { node-version: '${{ env.NODE_VERSION }}' }

      - uses: actions/setup-go@v3
        with: { go-version: '${{ env.GO_VERSION }}' }

      - name: Setup YARN
        run: npm install -g yarn @vue/cli-service

      - name: Checkout corteza repo
        uses: actions/checkout@v3
        with:
          path: corteza
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Clone CY repo
        uses: actions/checkout@v3
        with:
          repository: cortezaproject/corteza-e2e-cypress
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: 2024.9.x
          path: corteza-e2e-cypress

      - name: Patch E2E login bootstrap
        working-directory: corteza-e2e-cypress
        run: |
          node <<'NODE'
          const fs = require('fs')
          const file = 'cypress/support/commands.js'
          const source = fs.readFileSync(file, 'utf8')
          const marker = '  cy.get(`[data-test-id="${buttonLoginID}"]`).click()\n})'
          const replacement = `  cy.get(\`[data-test-id="\${buttonLoginID}"]\`).click()

          // The form submits to the server auth endpoint. Wait for that
          // redirect before the caller starts the Admin OAuth bootstrap.
          cy.location('pathname', { timeout: 60000 }).should('not.match', /\\/auth\\/login$/)
          })`
          if (!source.includes(marker)) throw new Error('login command marker not found')
          const patched = source.replace(marker, replacement)
          fs.writeFileSync(file, `${patched}

          // Cypress' window is the AUT only after a page has been visited;
          // reading sessionStorage before that point checks the runner. The
          // root route performs an asynchronous client-side redirect when the
          // session is missing, so wait for either the login form or the
          // authenticated shell before deciding which path to take.
          Cypress.Commands.add('preTestLogin', ({ email = Cypress.env('USER_EMAIL'), password = Cypress.env('USER_PASSWORD'), url }) => {
            cy.visit(url + '/', { failOnStatusCode: false })
            cy.get('body', { timeout: 60000 }).should($body => {
              const ready = $body.find('.nav-sidebar').length || $body.find('[data-test-id="input-email"]').length
              expect(ready, 'Admin login form or authenticated shell').to.be.greaterThan(0)
            }).then($body => {
              if ($body.find('[data-test-id="input-email"]').length) {
                cy.get('[data-test-id="input-email"]').clear().type(email)
                cy.get('[data-test-id="input-password"]').clear().type(password)
                cy.get('[data-test-id="button-login-and-remember"]').click()
                cy.location('pathname', { timeout: 60000 }).should('not.match', /\\/auth\\/login$/)
                cy.window({ timeout: 60000 }).should(win => {
                  expect(win.sessionStorage.getItem('auth.refresh-token'), 'Admin refresh token').to.be.a('string').and.not.empty
                })
                cy.visit(url + '/', { failOnStatusCode: false })
              }
            })
            cy.get('.nav-sidebar', { timeout: 60000 }).should('be.visible')
          })
          `)
          NODE

      - name: Cache lib dependencies
        uses: actions/cache@v3
        with:
          path: |
            corteza/lib/vue/node_modules
            corteza/lib/js/node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('corteza/lib/vue/yarn.lock', 'corteza/lib/js/yarn.lock') }}

      - name: Copy server language files
        working-directory: corteza/server/pkg/locale
        run: make src/en

      - name: Copy assets
        working-directory: corteza
        env:
          CLIENT_NAME: ${{ matrix.client.name }}
        run: |
          mv ./.github/workflows/assets/docker-compose.yaml ./
          cp .github/workflows/assets/client/vue.config-builder.js client/web/${CLIENT_NAME}/vue.config-builder.js
          cp .github/workflows/assets/client/config.js client/web/${CLIENT_NAME}/public/config.js

          docker compose -f docker-compose.yaml config > /tmp/docker-compose.corteza.yaml
          cd ../corteza-e2e-cypress && docker compose config > /tmp/docker-compose.corteza-e2e.yaml

      # - name: Cache Docker images
      #   uses: ScribeMD/docker-cache@0.3.7
      #   with:
      #     key: docker-${{ runner.os }}-${{ hashFiles('/tmp/docker-compose.corteza.yaml', '/tmp/docker-compose.corteza-e2e.yaml') }}
      #     # Only cache Corteza-specific images, not common base images already on runners
      #     images: |
      #       cypress/included:13.5.0

      - name: Run server and db
        working-directory: corteza
        run: |
          docker compose -f docker-compose.yaml run -d --name backend backend
          docker compose -f docker-compose.yaml run -d --name postgres postgres

      - name: Build js
        working-directory: corteza/lib/js
        run: |
          yarn install
          yarn build

      - name: Build vue
        working-directory: corteza/lib/vue
        run: |
          yarn install
          yarn build

      - name: Run ${{ matrix.client.name }}
        working-directory: corteza
        # re-link the packages for each app
        env:
          CLIENT_NAME: ${{ matrix.client.name }}
          CLIENT_PORT: ${{ matrix.client.port }}
        run: |
          rm -f .e2e-admin.log .e2e-admin-ready
          docker compose -f docker-compose.yaml \
            run -d \
            --name "${CLIENT_NAME}" \
            --use-aliases \
            client \
            sh -c "set -eu; exec > /corteza/.e2e-${CLIENT_NAME}.log 2>&1; \
                  echo 'Installing and linking client dependencies'; \
                  cd /corteza/lib/js && yarn link && \
                  cd /corteza/lib/vue && yarn link && \
                  cd /corteza/client/web/${CLIENT_NAME} && \
                  yarn link @cortezaproject/corteza-vue && \
                  yarn link @cortezaproject/corteza-js && \
                  yarn install --network-timeout 120000 && \
                  touch /corteza/.e2e-${CLIENT_NAME}-ready && \
                  exec yarn serve --host 127.0.0.1 --port ${CLIENT_PORT}"

      # github actions do not support docker-compose --wait
      - name: Wait for postgres healthcheck
        run: timeout 180s sh -c 'until docker ps | grep postgres | grep -q healthy; do echo "Waiting for container to be healthy..."; sleep 1; done'

      - name: Wait for ${{ matrix.client.name }} setup
        env:
          CLIENT_NAME: ${{ matrix.client.name }}
        run: |
          deadline=$((SECONDS + 600))
          until test -f "corteza/.e2e-${CLIENT_NAME}-ready"; do
            if ! docker inspect -f '{{.State.Running}}' "${CLIENT_NAME}" 2>/dev/null | grep -q true; then
              echo "${CLIENT_NAME} stopped before dependencies were ready"
              cat "corteza/.e2e-${CLIENT_NAME}.log" || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out preparing ${CLIENT_NAME}"
              cat "corteza/.e2e-${CLIENT_NAME}.log" || true
              exit 124
            fi
            sleep 5
          done

      - name: Wait for ${{ matrix.client.name }} dev server
        run: |
          # The Admin bundle is large and the first webpack build can exceed
          # ten minutes on a clean GitHub runner. Do not start Cypress until
          # the injected bundle exists, but allow the compile to finish.
          deadline=$((SECONDS + 1800))
          until html=$(curl --silent --fail "http://127.0.0.1:${{ matrix.client.port }}/") && \
                printf '%s' "$html" | grep -Eq '<script[^>]+src="[^"]*(app|chunk-vendors|runtime)[^"]*\.js'; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for Vue dev server compilation"
              sed -n '1,240p' "corteza/.e2e-${{ matrix.client.name }}.log" || true
              exit 124
            fi
            echo "Waiting for Vue dev server compilation..."
            sleep 5
          done

      - name: Wait for backend healthcheck
        run: timeout 180s sh -c 'until docker ps | grep backend | grep -q healthy; do echo "Waiting for container to be healthy..."; sleep 1; done'

      - name: Run CY tests for ${{ matrix.client.name }}
        env:
          CLIENT_NAME: ${{ matrix.client.name }}
          CLIENT_PORT: ${{ matrix.client.port }}
        working-directory: corteza-e2e-cypress
        run: |
          yarn install

          docker compose run \
            --entrypoint="bash -c \" \
              cypress run --spec cypress/e2e/basic-functionalities/${CLIENT_NAME}/index.cy.js --browser chrome --config video=false,screenshotOnRunFailure=false \
            \"" \
          cypress

      - name: Publish results
        # always() runs the step even when canceled manually
        if: ${{ (success() || failure()) && env.RELEASE_CRUST_SFTP_URI != '' && env.RELEASE_CRUST_SFTP_KEY != '' }}
        working-directory: corteza-e2e-cypress
        env:
          RELEASE_CRUST_SFTP_URI: ${{ secrets.RELEASE_CRUST_SFTP_URI }}
          RELEASE_CRUST_SFTP_KEY: ${{ secrets.RELEASE_CRUST_SFTP_KEY }}
          RELEASE_CRUST_KEY_FILE: ${{ env.TMP_KEY }}
        run: |
          npx mochawesome-merge "cypress/reports/*.json" > cypress/report.json && \
          npx marge -o cypress/reports-build -f index.html -i cypress/report.json && \
          echo "put cypress/reports-build/index.html" | sftp -q -o "StrictHostKeyChecking no" -i ${RELEASE_CRUST_KEY_FILE} ${RELEASE_CRUST_SFTP_URI}

  notify-failure:
    needs: [server-client-setup]
    runs-on: ubuntu-22.04
    if: failure()
    env:
      MATRIX_HOME_SERVER: ${{ secrets.MATRIX_HOME_SERVER }}
      MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
      MATRIX_ROOM_ID: ${{ secrets.MATRIX_ROOM_ID }}
    steps:
      - name: Send message on failed testing results
        if: ${{ env.MATRIX_HOME_SERVER != '' && env.MATRIX_ACCESS_TOKEN != '' && env.MATRIX_ROOM_ID != '' }}
        uses: fadenb/matrix-chat-message@v0.0.6
        env:
          E2E_REPORTS_USER: ${{ secrets.E2E_REPORTS_USER }}
          E2E_REPORTS_PASS: ${{ secrets.E2E_REPORTS_PASS }}
          SCREENSHOTS_GEN_FOLDER: ${{ env.SCREENSHOTS_GEN_FOLDER }}
        with:
          homeserver: ${{ secrets.MATRIX_HOME_SERVER }}
          token: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          channel: ${{ secrets.MATRIX_ROOM_ID }}
          message: |
            ❌ E2e tests did not pass

            🔗 https://${{ secrets.E2E_REPORTS_USER }}:${{ secrets.E2E_REPORTS_PASS }}@releases.cortezaproject.org/e2e-reports/
