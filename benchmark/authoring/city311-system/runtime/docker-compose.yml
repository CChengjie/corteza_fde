name: c311-system-task

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: city311
      POSTGRES_USER: city311
      POSTGRES_PASSWORD: city311-task-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d city311 -U city311"]
      interval: 2s
      timeout: 3s
      retries: 20

  mapping:
    image: python:3.12-alpine
    volumes:
      - ../fixtures/mapping-fixture.py:/fixture/mapping-fixture.py:ro
    command: ["python3", "/fixture/mapping-fixture.py"]

  app:
    build:
      context: ${CANDIDATE_ROOT:?CANDIDATE_ROOT is required}
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-18100}:8080"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://city311:city311-task-password@postgres:5432/city311?sslmode=disable
      MAP_BASE_URL: http://mapping:8081
      MAP_API_TOKEN: c311-system-mapping-token
